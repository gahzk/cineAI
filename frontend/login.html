<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineAI — Entrar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <a href="/" class="auth-logo-text" style="text-decoration:none">Cine<span>AI</span></a>
      <p class="auth-logo-tagline">Entre para guardar suas recomendações e pedir à IA.</p>
    </div>

    <form id="auth-form" class="panel" novalidate>
      <h1 class="section-title" id="form-title" style="margin-top:0">Entrar</h1>
      <div class="form-group" id="username-group" hidden>
        <label class="form-label" for="username">Nome de usuário</label>
        <input class="form-control" id="username" name="username" autocomplete="username" minlength="3" maxlength="50">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72">
        <span class="form-hint" id="password-hint" hidden>Mínimo de 8 caracteres.</span>
      </div>
      <button class="btn btn-primary btn-full" type="submit" id="submit">Entrar</button>
      <div id="alert" role="alert"></div>
      <p class="auth-switch"><span id="switch-text">Não tem conta?</span> <a href="#" id="switch">Criar conta</a></p>
    </form>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
  if (getToken()) location.href = '/';

  let registering = false;
  const $ = id => document.getElementById(id);

  $('switch').addEventListener('click', (e) => {
    e.preventDefault();
    registering = !registering;
    $('form-title').textContent = registering ? 'Criar conta' : 'Entrar';
    $('submit').textContent = registering ? 'Criar conta' : 'Entrar';
    $('switch-text').textContent = registering ? 'Já tem conta?' : 'Não tem conta?';
    $('switch').textContent = registering ? 'Entrar' : 'Criar conta';
    $('username-group').hidden = !registering;
    $('password-hint').hidden = !registering;
    $('password').autocomplete = registering ? 'new-password' : 'current-password';
    $('alert').innerHTML = '';
  });

  $('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { email: $('email').value.trim(), password: $('password').value };
    if (registering) body.username = $('username').value.trim();
    $('submit').disabled = true;
    try {
      const data = await api('POST', registering ? '/auth/register' : '/auth/login', body);
      setToken(data.access_token);
      location.href = '/';
    } catch (err) {
      $('alert').innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
    } finally {
      $('submit').disabled = false;
    }
  });
</script>
</body>
</html>
