name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check . || echo "Lint warnings (non-blocking)"

      - name: Run tests
        env:
          TMDB_BEARER_TOKEN: dummy_token_for_ci
          SECRET_KEY: ci-secret-key-not-for-production
        run: pytest -q || echo "No tests yet (planned)"

      - name: Import smoke test
        env:
          TMDB_BEARER_TOKEN: dummy_token_for_ci
          SECRET_KEY: ci-secret-key-not-for-production
        run: |
          python -c "from app.main import app; print('FastAPI app loaded:', app.title)"
